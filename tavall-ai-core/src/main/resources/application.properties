spring.application.name=tavall-ai
server.address=0.0.0.0
server.port=9000

spring.datasource.url=${AGENT_TASK_MANAGER_TEST_DB_URL:${AGENT_TASK_MANAGER_DB_URL:${DB_URL:}}}
spring.datasource.username=${AGENT_TASK_MANAGER_TEST_DB_USERNAME:${AGENT_TASK_MANAGER_DB_USERNAME:${DB_USER:}}}
spring.datasource.password=${AGENT_TASK_MANAGER_TEST_DB_PASSWORD:${AGENT_TASK_MANAGER_DB_PASSWORD:${DB_PASS:}}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=1

spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

spring.data.redis.host=${AGENT_TASK_MANAGER_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${AGENT_TASK_MANAGER_REDIS_PORT:6379}
spring.data.redis.database=${AGENT_TASK_MANAGER_REDIS_DB:5}

spring.thymeleaf.cache=false
server.forward-headers-strategy=framework
logging.level.root=${AGENT_TASK_MANAGER_LOG_LEVEL_ROOT:INFO}
logging.level.org.springframework=${AGENT_TASK_MANAGER_LOG_LEVEL_SPRING:INFO}
logging.level.org.tavall.ai=${AGENT_TASK_MANAGER_LOG_LEVEL_APP:INFO}

app.security.username=${AGENT_TASK_MANAGER_USERNAME:agent}
app.security.password=${AGENT_TASK_MANAGER_PASSWORD:}
app.security.remember-me-key=${AGENT_TASK_MANAGER_REMEMBER_ME_KEY:tavall-ai-remember-me}
app.security.mcp-no-auth-enabled=${AGENT_TASK_MANAGER_MCP_NO_AUTH_ENABLED:false}
app.security.proxy-auth-enabled=${AGENT_TASK_MANAGER_PROXY_AUTH_ENABLED:false}
app.security.proxy-auth-header=${AGENT_TASK_MANAGER_PROXY_AUTH_HEADER:X-Forwarded-User}
app.runtime.redis-namespace=${AGENT_TASK_MANAGER_REDIS_NAMESPACE:tavall-ai:tasks}
app.bridge.enabled=${AGENT_TASK_MANAGER_BRIDGE_ENABLED:false}
app.bridge.agent-id=${AGENT_TASK_MANAGER_BRIDGE_AGENT_ID:}
app.bridge.command=${AGENT_TASK_MANAGER_BRIDGE_COMMAND:codex}
app.bridge.poll-interval-ms=${AGENT_TASK_MANAGER_BRIDGE_POLL_INTERVAL_MS:5000}
app.bridge.max-message-chars=${AGENT_TASK_MANAGER_BRIDGE_MAX_MESSAGE_CHARS:4000}
app.computer-use.runner-command-path=${AGENT_TASK_MANAGER_COMPUTER_USE_RUNNER_COMMAND_PATH:/api/automation/command}
app.computer-use.runner-capabilities-path=${AGENT_TASK_MANAGER_COMPUTER_USE_RUNNER_CAPABILITIES_PATH:/api/automation/capabilities}
app.computer-use.runner-auth-token=${AGENT_TASK_MANAGER_COMPUTER_USE_RUNNER_AUTH_TOKEN:}
app.computer-use.runner-lease-ttl-seconds=${AGENT_TASK_MANAGER_COMPUTER_USE_RUNNER_LEASE_TTL_SECONDS:120}
app.computer-use.vision-poll-interval-ms=${AGENT_TASK_MANAGER_COMPUTER_USE_VISION_POLL_INTERVAL_MS:400}
app.computer-use.hytale.launcher-path=${AGENT_TASK_MANAGER_HYTALE_LAUNCHER_PATH:}
app.computer-use.hytale.client-path=${AGENT_TASK_MANAGER_HYTALE_CLIENT_PATH:}
app.computer-use.hytale.launcher-process-name=${AGENT_TASK_MANAGER_HYTALE_LAUNCHER_PROCESS_NAME:HytaleLauncher}
app.computer-use.hytale.client-process-name=${AGENT_TASK_MANAGER_HYTALE_CLIENT_PROCESS_NAME:Hytale}
app.computer-use.hytale.launcher-window-title-contains=${AGENT_TASK_MANAGER_HYTALE_LAUNCHER_TITLE:Hytale}
app.computer-use.hytale.client-window-title-contains=${AGENT_TASK_MANAGER_HYTALE_CLIENT_TITLE:Hytale}
app.computer-use.hytale.server-target=${AGENT_TASK_MANAGER_HYTALE_SERVER_TARGET:Remote Dev}
app.computer-use.hytale.default-chart-id=${AGENT_TASK_MANAGER_HYTALE_DEFAULT_CHART_ID:debug/test-4k}
app.computer-use.hytale.visual-anchors.launcherReady=${AGENT_TASK_MANAGER_HYTALE_ANCHOR_LAUNCHER_READY:}
app.computer-use.hytale.visual-anchors.clientReady=${AGENT_TASK_MANAGER_HYTALE_ANCHOR_CLIENT_READY:}
app.computer-use.hytale.visual-anchors.worldJoined=${AGENT_TASK_MANAGER_HYTALE_ANCHOR_WORLD_JOINED:}
app.computer-use.hytale.visual-anchors.songSelect=${AGENT_TASK_MANAGER_HYTALE_ANCHOR_SONG_SELECT:}
app.computer-use.hytale.visual-anchors.gameplayAssets=${AGENT_TASK_MANAGER_HYTALE_ANCHOR_GAMEPLAY_ASSETS:}
app.computer-use.hytale.gameplay-keybinds.lane1=${AGENT_TASK_MANAGER_HYTALE_KEY_LANE1:D}
app.computer-use.hytale.gameplay-keybinds.lane2=${AGENT_TASK_MANAGER_HYTALE_KEY_LANE2:F}
app.computer-use.hytale.gameplay-keybinds.lane3=${AGENT_TASK_MANAGER_HYTALE_KEY_LANE3:J}
app.computer-use.hytale.gameplay-keybinds.lane4=${AGENT_TASK_MANAGER_HYTALE_KEY_LANE4:K}
app.codex-client-platform.enabled=${AGENT_TASK_MANAGER_CODEX_CLIENT_PLATFORM_ENABLED:false}
app.codex-client-platform.preferred-model=${AGENT_TASK_MANAGER_CODEX_CLIENT_PLATFORM_MODEL:gpt-5.3-codex}
app.codex-client-platform.preferred-reasoning-effort=${AGENT_TASK_MANAGER_CODEX_CLIENT_PLATFORM_REASONING_EFFORT:high}
app.codex-client-platform.default-profile-key=${AGENT_TASK_MANAGER_CODEX_CLIENT_PLATFORM_DEFAULT_PROFILE:workspace-default}
app.codex-client-platform.default-event-page-size=${AGENT_TASK_MANAGER_CODEX_CLIENT_PLATFORM_DEFAULT_EVENT_PAGE_SIZE:100}
app.codex-client-platform.max-event-page-size=${AGENT_TASK_MANAGER_CODEX_CLIENT_PLATFORM_MAX_EVENT_PAGE_SIZE:500}
app.codex-client-platform.runtime-lease-ttl-seconds=${AGENT_TASK_MANAGER_CODEX_CLIENT_PLATFORM_RUNTIME_LEASE_TTL_SECONDS:90}
app.codex-client-platform.sse-replay-limit=${AGENT_TASK_MANAGER_CODEX_CLIENT_PLATFORM_SSE_REPLAY_LIMIT:50}
app.codex.mcp-server-bin-dir=${AGENT_TASK_MANAGER_CODEX_MCP_SERVER_BIN_DIR:${user.dir}/mcp-servers/bin}
app.codex.reasoning-effort=${AGENT_TASK_MANAGER_CODEX_REASONING_EFFORT:high}
app.codex.add-directories=${AGENT_TASK_MANAGER_CODEX_ADD_DIRECTORIES:${user.dir},/srv}
app.codex.downstream-central-server=${AGENT_TASK_MANAGER_CODEX_DOWNSTREAM_CENTRAL_SERVER:tavall-ai}
app.codex.required-mcp-servers=${AGENT_TASK_MANAGER_CODEX_REQUIRED_MCP_SERVERS:}
app.codex.central-server-local-stdio-enabled=${AGENT_TASK_MANAGER_CODEX_CENTRAL_SERVER_LOCAL_STDIO_ENABLED:true}
app.codex.central-server-jar-path=${AGENT_TASK_MANAGER_CODEX_CENTRAL_SERVER_JAR_PATH:}
app.codex.remote-tool-execution-enabled=${AGENT_TASK_MANAGER_CODEX_REMOTE_TOOL_EXECUTION_ENABLED:true}
app.repo-catalog.roots=${AGENT_TASK_MANAGER_REPO_ROOTS:${user.dir},/srv}
app.repo-catalog.max-depth=${AGENT_TASK_MANAGER_REPO_SCAN_MAX_DEPTH:2}
app.operator.external-base-url=${AGENT_TASK_MANAGER_EXTERNAL_BASE_URL:https://docs.tavall.org}
app.operator.dashboard-path=${AGENT_TASK_MANAGER_DASHBOARD_PATH:/tavall-ai/}
app.operator.ide-path=${AGENT_TASK_MANAGER_IDE_PATH:/code/}
app.operator.ide-health-url=${AGENT_TASK_MANAGER_IDE_HEALTH_URL:http://127.0.0.1:13337/healthz}
app.operator.ide-workspace=${AGENT_TASK_MANAGER_IDE_WORKSPACE:/srv}
app.operator.support-command=${AGENT_TASK_MANAGER_SUPPORT_COMMAND:bash -lc}
app.mongodb.uri=${AGENT_TASK_MANAGER_MONGODB_URI:}
app.mongodb.database=${AGENT_TASK_MANAGER_MONGODB_DATABASE:agent_task_manager}
app.qdrant.base-url=${AGENT_TASK_MANAGER_QDRANT_BASE_URL:}
app.qdrant.api-key=${AGENT_TASK_MANAGER_QDRANT_API_KEY:}
app.qdrant.collection=${AGENT_TASK_MANAGER_QDRANT_COLLECTION:agent_task_manager_context_v2}
app.qdrant.project-collection-prefix=${AGENT_TASK_MANAGER_QDRANT_PROJECT_COLLECTION_PREFIX:agent_task_manager_project}
app.qdrant.knowledge-collection-prefix=${AGENT_TASK_MANAGER_QDRANT_KNOWLEDGE_COLLECTION_PREFIX:agent_task_manager_knowledge}
app.qdrant.request-timeout=${AGENT_TASK_MANAGER_QDRANT_REQUEST_TIMEOUT:10s}
app.embedding.provider-order=${AGENT_TASK_MANAGER_EMBEDDING_PROVIDER_ORDER:local}
app.embedding.dimensions=${AGENT_TASK_MANAGER_EMBEDDING_DIMENSIONS:384}
app.embedding.gemini-api-key=${GEMINI_API_KEY:}
app.embedding.gemini-model=${AGENT_TASK_MANAGER_GEMINI_EMBEDDING_MODEL:gemini-embedding-2-preview}
app.embedding.local-command=${AGENT_TASK_MANAGER_LOCAL_EMBEDDING_COMMAND:python3 ${user.dir}/scripts/fastembed_embed.py}
app.embedding.local-model=${AGENT_TASK_MANAGER_LOCAL_EMBEDDING_MODEL:BAAI/bge-small-en-v1.5}
app.embedding.local-timeout-seconds=${AGENT_TASK_MANAGER_LOCAL_EMBEDDING_TIMEOUT_SECONDS:30}
app.semantic-index.max-chunk-chars=${AGENT_TASK_MANAGER_SEMANTIC_MAX_CHUNK_CHARS:1800}
app.semantic-index.text-target-chunk-lines=${AGENT_TASK_MANAGER_SEMANTIC_TEXT_TARGET_LINES:80}
app.semantic-index.code-target-chunk-lines=${AGENT_TASK_MANAGER_SEMANTIC_CODE_TARGET_LINES:120}
app.semantic-index.doc-target-chunk-lines=${AGENT_TASK_MANAGER_SEMANTIC_DOC_TARGET_LINES:60}
app.semantic-index.overlap-lines=${AGENT_TASK_MANAGER_SEMANTIC_OVERLAP_LINES:12}
app.semantic-index.chat-window-messages=${AGENT_TASK_MANAGER_SEMANTIC_CHAT_WINDOW_MESSAGES:6}
app.semantic-index.chat-window-overlap=${AGENT_TASK_MANAGER_SEMANTIC_CHAT_WINDOW_OVERLAP:2}
app.semantic-index.reindex-repo-names=${AGENT_TASK_MANAGER_SEMANTIC_REINDEX_REPO_NAMES:AgentTaskManager,Webstore,CustomMinecraftServer,Minecraft-CTF,TavallCouriers,Portfolio,MCRSpeedrun}
app.memory-sync.enabled=${AGENT_TASK_MANAGER_MEMORY_SYNC_ENABLED:true}
app.memory-sync.managed-repo-backfill-enabled=${AGENT_TASK_MANAGER_MEMORY_SYNC_MANAGED_REPO_BACKFILL_ENABLED:true}
app.memory-sync.workspace-sync-enabled=${AGENT_TASK_MANAGER_MEMORY_SYNC_WORKSPACE_ENABLED:true}
app.memory-sync.outbox-batch-size=${AGENT_TASK_MANAGER_MEMORY_SYNC_OUTBOX_BATCH_SIZE:50}
app.memory-sync.max-repo-backfills-per-cycle=${AGENT_TASK_MANAGER_MEMORY_SYNC_MAX_REPO_BACKFILLS_PER_CYCLE:1}
app.memory-sync.max-outbox-batches-per-cycle=${AGENT_TASK_MANAGER_MEMORY_SYNC_MAX_OUTBOX_BATCHES_PER_CYCLE:4}
app.memory-sync.poll-interval-ms=${AGENT_TASK_MANAGER_MEMORY_SYNC_POLL_INTERVAL_MS:15000}
app.memory-sync.retry-delay-ms=${AGENT_TASK_MANAGER_MEMORY_SYNC_RETRY_DELAY_MS:15000}
app.knowledge-index.enabled=${AGENT_TASK_MANAGER_KNOWLEDGE_ENABLED:false}
app.knowledge-index.knowledge-base=${AGENT_TASK_MANAGER_KNOWLEDGE_BASE:project-knowledge}
app.knowledge-index.source-root=${AGENT_TASK_MANAGER_KNOWLEDGE_SOURCE_ROOT:}
app.knowledge-index.jar-path=${AGENT_TASK_MANAGER_KNOWLEDGE_JAR_PATH:}
app.knowledge-index.max-chunk-chars=${AGENT_TASK_MANAGER_KNOWLEDGE_MAX_CHUNK_CHARS:1800}
app.knowledge-index.target-chunk-lines=${AGENT_TASK_MANAGER_KNOWLEDGE_TARGET_CHUNK_LINES:80}
app.knowledge-index.overlap-lines=${AGENT_TASK_MANAGER_KNOWLEDGE_OVERLAP_LINES:20}
app.knowledge-index.prompt-result-limit=${AGENT_TASK_MANAGER_KNOWLEDGE_PROMPT_RESULT_LIMIT:3}
app.orchestration.worker-command=${AGENT_TASK_MANAGER_WORKER_COMMAND:codex}
app.orchestration.worker-model=${AGENT_TASK_MANAGER_WORKER_MODEL:gpt-5.3-codex}
app.orchestration.overseer-agent-id=${AGENT_TASK_MANAGER_OVERSEER_AGENT_ID:overseer@project-novus}
app.orchestration.cleanup-agent-id=${AGENT_TASK_MANAGER_CLEANUP_AGENT_ID:cleanup@project-novus}
app.orchestration.autonomy-enabled=${AGENT_TASK_MANAGER_AUTONOMY_ENABLED:false}
app.orchestration.legacy-autonomy-enabled=${AGENT_TASK_MANAGER_LEGACY_AUTONOMY_ENABLED:false}
app.orchestration.autonomy-poll-interval-ms=${AGENT_TASK_MANAGER_AUTONOMY_POLL_INTERVAL_MS:15000}
app.orchestration.autonomy-max-batch-count-per-cycle=${AGENT_TASK_MANAGER_AUTONOMY_MAX_BATCH_COUNT_PER_CYCLE:4}
app.orchestration.autonomy-max-worker-runs-per-cycle=${AGENT_TASK_MANAGER_AUTONOMY_MAX_WORKER_RUNS_PER_CYCLE:4}
app.orchestration.lease-duration-seconds=${AGENT_TASK_MANAGER_LEASE_DURATION_SECONDS:90}
app.orchestration.check-in-timeout-seconds=${AGENT_TASK_MANAGER_CHECK_IN_TIMEOUT_SECONDS:120}
app.mcp.base-url=${AGENT_TASK_MANAGER_MCP_BASE_URL:https://docs.tavall.org/tavall-ai}
app.mcp.endpoint=${AGENT_TASK_MANAGER_MCP_ENDPOINT:/mcp}
