app.mcp.tool-groups=${AGENT_TASK_MANAGER_MCP_TOOL_GROUPS:}
app.tool-policy.force-harness-for-all-prompts=true
app.tool-policy.forced-tool-calls=runHarnessToolBundle(repo-context)
app.tool-policy.memory-enforcement-mode=${AGENT_TASK_MANAGER_TOOL_POLICY_MEMORY_ENFORCEMENT_MODE:auto-gate}
app.tool-policy.git-enforcement-scope=${AGENT_TASK_MANAGER_TOOL_POLICY_GIT_ENFORCEMENT_SCOPE:repo-backed-write}
app.tool-policy.native-windows-shell-enforcement-mode=${AGENT_TASK_MANAGER_TOOL_POLICY_NATIVE_WINDOWS_SHELL_ENFORCEMENT_MODE:forbid-powershell}
