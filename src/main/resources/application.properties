spring.application.name=agent-task-manager
server.address=0.0.0.0
server.port=9000

spring.datasource.url=${AGENT_TASK_MANAGER_DB_URL:}
spring.datasource.username=${AGENT_TASK_MANAGER_DB_USERNAME:}
spring.datasource.password=${AGENT_TASK_MANAGER_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=1

spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

spring.data.redis.host=${AGENT_TASK_MANAGER_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${AGENT_TASK_MANAGER_REDIS_PORT:6379}
spring.data.redis.database=${AGENT_TASK_MANAGER_REDIS_DB:5}

spring.thymeleaf.cache=false
spring.jackson.serialization.write-dates-as-timestamps=false
server.forward-headers-strategy=framework

app.security.username=${AGENT_TASK_MANAGER_USERNAME:agent}
app.security.password=${AGENT_TASK_MANAGER_PASSWORD:}
app.security.remember-me-key=${AGENT_TASK_MANAGER_REMEMBER_ME_KEY:agent-task-manager-remember-me}
app.runtime.redis-namespace=${AGENT_TASK_MANAGER_REDIS_NAMESPACE:agent-task-manager:tasks}

