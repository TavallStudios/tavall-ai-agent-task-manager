<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Task Manager Login</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-shell">
  <main class="login-card">
    <div class="eyebrow">Agent Task Manager</div>
    <h1>Sign in</h1>
    <p class="muted">Use the Spring Security account configured for the control plane before exposing this service beyond your private network.</p>

    <div class="alert error" th:if="${param.error}">
      The username or password was rejected.
    </div>
    <div class="alert success" th:if="${param.logout}">
      Signed out.
    </div>

    <form method="post" th:action="@{/login}" class="stack">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <label>
        <span>Username</span>
        <input type="text" name="username" autocomplete="username" required>
      </label>
      <label>
        <span>Password</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit">Open Control Plane</button>
    </form>
  </main>
</body>
</html>
